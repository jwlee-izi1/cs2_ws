# Multi-drone SITL config — 4 drones for CrazySim smoke test.
# UDP cflib port = 19850 + cf_id.
fileversion: 3

robots:
  # 2026-05-25 — moved drones to per-quadrant central placement (matches HW demo arc
  # in crazyflies_hw.yaml). Avoids the sitl_multiagent_square default (0,0)(1,0)(0,1)(1,1)
  # where cf3+cf4 cross paths through origin during initial figure-8 traversal and BVC
  # may not react in time at 1.0 m/s.
  cf1:
    enabled: true
    uri: udp://127.0.0.1:19850
    initial_position: [0.3, 0.3, 0.0]   # +x +y quadrant
    type: cf21
  cf2:
    enabled: true
    uri: udp://127.0.0.1:19851
    initial_position: [0.3, -0.3, 0.0]  # +x -y quadrant
    type: cf21
  cf3:
    enabled: true
    uri: udp://127.0.0.1:19852
    initial_position: [-0.3, -0.3, 0.0]  # -x -y quadrant
    type: cf21
  cf4:
    enabled: true
    uri: udp://127.0.0.1:19853
    initial_position: [-0.3, 0.3, 0.0]   # -x +y quadrant
    type: cf21

robot_types:
  cf21:
    motion_capture:
      enabled: false
      tracking: "off"
      marker: default_single_marker
      dynamics: default
    big_quad: false
    battery:
      voltage_warning: 3.8
      voltage_critical: 3.7

all:
  # BVC peer-position broadcast: the server tells each drone its neighbors'
  # positions at this rate (Hz) via packed EXT_POSITION_PACKED CRTP, so the
  # onboard collision avoidance (colAv below) actually has neighbors to avoid.
  # 0 = off (the crazyswarm2 default). Requires the cf2-sitl firmware built
  # with collision_avoidance.c (sitl_make) — see CRAZYSIM_MIGRATION.md.
  peer_broadcast_hz: 30.0
  firmware_params:
    commander:
      enHighLevel: 1
    stabilizer:
      estimator: 2
      controller: 1
    # Buffered Voronoi Cell onboard collision avoidance (James Preiss). Enabled in sim
    # so Stage 0-sim mirrors the HW configuration for hw_multi_drone_verification.md
    # Stages 3b/4. Onboard, decentralized, mocap-driven (sim has perfect mocap).
    colAv:
      enable: 1
    # 2026-05-28 — Velocity-loop integrator wind-up fix (vxKi=vyKi=0) WAS
    # needed for cmd_position-based RL deployment which caused PI wind-up
    # crashes. The current RL deployment uses trajectory_streamer (/cfN/go_to)
    # which bypasses the velocity-PI entirely (firmware uses high-level
    # commander's polynomial trajectory), so we restore firmware defaults.
    # Keeping the Ki=0 override would only hurt figure-8 demo's tracking
    # accuracy. Commented out — re-enable if reverting RL to cmd_position.
    # velCtlPid:
    #   vxKi: 0.0
    #   vyKi: 0.0
  firmware_logging:
    # Required for /cfN/odom (and /cfN/scan if you ever add a multiranger deck).
    # The thermal_sensor_node subscribes to /cfN/odom for drone pose.
    enabled: true
    default_topics:
      odom:
        frequency: 20
